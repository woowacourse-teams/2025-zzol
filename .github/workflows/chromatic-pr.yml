name: Deploy PR Storybook Preview

on:
  pull_request:
    branches:
      - dev
    types: [opened, synchronize]
    paths:
      - 'frontend/**/*.stories.*'
      - 'frontend/.storybook/**'

# 스냅샷 단위 과금이라 중복 실행이 그대로 요금이다.
# 기준선을 굽는 chromatic-base(dev push)는 일부러 제외했다 — 취소되면
# 그 커밋의 기준선 빌드가 남지 않는다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromatic-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Publish PR Storybook Preview
        id: chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: frontend
          onlyChanged: true
          exitZeroOnChanges: true

      - name: Comment Storybook Preview on PR
        if: steps.chromatic.outputs.storybookUrl != ''
        uses: actions/github-script@v9
        env:
          STORYBOOK_URL: ${{ steps.chromatic.outputs.storybookUrl }}
          BUILD_URL: ${{ steps.chromatic.outputs.buildUrl }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);

            const body = `
            ## 🎨 Storybook Preview

            🔖 Commit: \`${sha}\`

            🔗 **Storybook URL**  
            ${process.env.STORYBOOK_URL}

            🔗 **Chromatic Build**  
            ${process.env.BUILD_URL}
            `;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });
