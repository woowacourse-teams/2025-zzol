name: Docs CI

on:
  # PR이 열릴 때, 업데이트될 때, 다시 열릴 때
  pull_request:
    branches: [be/dev, dev]
    paths:
      - "**/*.md"
      - ".markdownlint.jsonc"
      - ".markdownlint-cli2.jsonc"
      - ".github/workflows/docs-ci.yml"

  # 커밋이 푸시될 때
  push:
    branches: [be/dev, dev]
    paths:
      - "**/*.md"
      - ".markdownlint.jsonc"
      - ".markdownlint-cli2.jsonc"
      - ".github/workflows/docs-ci.yml"

# 같은 ref의 이전 실행은 취소해 중복 CI 낭비를 줄인다
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      # 규칙 SSOT: .markdownlint.jsonc / ignores는 .markdownlint-cli2.jsonc 를 자동 적용한다.
      # globs는 CLI 인자가 config의 globs 를 덮으므로 여기서 명시한다.
      # 버전 bump 은 Dependabot(github-actions) 이 관리한다.
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@8de2aa07cae85fd17c0b35642db70cf5495f1d25 # v24
        with:
          globs: "**/*.md"
