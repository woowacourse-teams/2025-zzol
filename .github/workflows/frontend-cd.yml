name: Frontend Deploy (CD)

# AWS CodePipeline의 GitHub 소스 연결(AWS Connector for GitHub App)을 조직 정책상
# 더 이상 사용할 수 없어(#1568) GitHub Actions가 직접 빌드·배포한다.
# OIDC로 AWS Role을 assume하므로 장기 access key를 쓰지 않는다.
# dev·prod가 같은 Role을 assume한다 — IAM trust policy의 sub 조건에
# refs/heads/dev와 refs/heads/prod가 모두 등록돼 있어야 한다(#1574).
on:
  push:
    branches:
      - dev
      - prod
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - '.github/workflows/frontend-cd.yml'
  workflow_dispatch:

concurrency:
  group: frontend-deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # 1. 공통 빌드/테스트 워크플로우 호출 (frontend-ci.yml 재사용)
  ci-and-build:
    uses: ./.github/workflows/frontend-ci.yml
    secrets: inherit

  # 2. Deploy Job — S3 sync + CloudFront invalidation
  deploy:
    needs: ci-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    env:
      S3_BUCKET: ${{ github.ref_name == 'prod' && vars.FRONTEND_S3_BUCKET_PROD || vars.FRONTEND_S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ github.ref_name == 'prod' && vars.FRONTEND_CLOUDFRONT_DISTRIBUTION_ID_PROD || vars.FRONTEND_CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
      # 버킷을 dev/prod가 프리픽스(zzol/fe-dev, zzol/fe-prod)로 공유하므로,
      # 프리픽스 없는 값이 들어오면 루트 sync --delete가 양쪽 환경을 전부 지운다
      # (2026-07-17 실제 발생). 값에 '/'가 없으면 배포를 중단한다.
      - name: Guard — S3 경로에 환경 프리픽스 필수
        run: |
          case "${S3_BUCKET}" in
            */*) echo "S3 target OK: s3://${S3_BUCKET}" ;;
            *) echo "::error::S3 버킷 변수('${S3_BUCKET}')에 환경 프리픽스가 없습니다 — 루트 sync --delete는 버킷 전체를 삭제합니다"; exit 1 ;;
          esac

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.FRONTEND_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-2' }}

      - name: Sync to S3
        run: aws s3 sync dist "s3://${S3_BUCKET}" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"

      - name: Deployment Summary
        if: always()
        run: |
          {
            echo "### Frontend Deploy Summary :rocket:"
            echo ""
            echo "- **Branch:** ${{ github.ref_name }}"
            echo "- **Commit:** ${{ github.sha }}"
            echo "- **Status:** ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
