name: Frontend Deploy (CD)

# AWS CodePipeline의 GitHub 소스 연결(AWS Connector for GitHub App)을 조직 정책상
# 더 이상 사용할 수 없어(#1568) GitHub Actions가 직접 빌드·배포한다.
# OIDC로 AWS Role을 assume하므로 장기 access key를 쓰지 않는다.
# dev·prod가 같은 Role을 assume한다 — IAM trust policy의 sub 조건에
# refs/heads/dev와 refs/heads/prod가 모두 등록돼 있어야 한다(#1574).
on:
  push:
    branches:
      - dev
      - prod
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - '.github/workflows/frontend-cd.yml'
  workflow_dispatch:

concurrency:
  group: frontend-deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # 1. 공통 빌드/테스트 워크플로우 호출 (frontend-ci.yml 재사용)
  ci-and-build:
    uses: ./.github/workflows/frontend-ci.yml
    secrets: inherit

  # 2. Deploy Job — S3 sync + CloudFront invalidation
  deploy:
    needs: ci-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    env:
      S3_BUCKET: ${{ github.ref_name == 'prod' && vars.FRONTEND_S3_BUCKET_PROD || vars.FRONTEND_S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ github.ref_name == 'prod' && vars.FRONTEND_CLOUDFRONT_DISTRIBUTION_ID_PROD || vars.FRONTEND_CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
      # 버킷을 dev/prod가 프리픽스(zzol/fe-dev, zzol/fe-prod)로 공유하므로,
      # 프리픽스 없는 값이 들어오면 루트 sync --delete가 양쪽 환경을 전부 지운다
      # (2026-07-17 실제 발생). 값에 '/'가 없으면 배포를 중단한다.
      - name: Guard — S3 경로에 환경 프리픽스 필수
        run: |
          case "${S3_BUCKET}" in
            */*) echo "S3 target OK: s3://${S3_BUCKET}" ;;
            *) echo "::error::S3 버킷 변수('${S3_BUCKET}')에 환경 프리픽스가 없습니다 — 루트 sync --delete는 버킷 전체를 삭제합니다"; exit 1 ;;
          esac

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.FRONTEND_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-2' }}

      # sync 가 덮어쓰기 전에 직전 배포 시각을 잡아 둔다. 아래 정리 단계가 직전 빌드 파일을 지우지 않게 하는 기준이다.
      # 해시 파일은 index.html 보다 먼저 올라가 몇 초 앞선 시각을 가지므로 1시간 여유를 뺀다.
      - name: Capture previous deploy time
        run: |
          PREV="$(aws s3api head-object --bucket "${S3_BUCKET%%/*}" --key "${S3_BUCKET#*/}/index.html" \
            --query LastModified --output text 2>/dev/null || true)"
          if [ -n "$PREV" ] && [ "$PREV" != "None" ]; then
            echo "PREV_DEPLOY=$(date -u -d "@$(( $(date -u -d "$PREV" +%s) - 3600 ))" +%Y-%m-%dT%H:%M:%S)" >> "$GITHUB_ENV"
          fi

      # 파일명에 20자리 contenthash 가 붙은 번들·이미지는 내용이 바뀌면 이름도 바뀌므로 1년 캐시한다.
      # 나머지(HTML·service-worker.js·manifest·fonts 등)는 매번 재검증하게 no-cache 로 둔다(#1857).
      # 해시 파일을 먼저 올려야 새 HTML 이 아직 없는 청크를 가리키는 순간이 생기지 않는다.
      - name: Sync hashed assets to S3
        run: |
          aws s3 sync dist "s3://${S3_BUCKET}" \
            --exclude "*" --include "*.????????????????????.*" \
            --cache-control "public, max-age=31536000, immutable"

      # --delete 를 쓰지 않는다. 배포 직전에 열린 탭은 옛 해시 청크를 요청하므로 아래 단계에서 기간을 두고 지운다.
      - name: Sync other files to S3
        run: |
          aws s3 sync dist "s3://${S3_BUCKET}" \
            --exclude "*.????????????????????.*" \
            --cache-control "no-cache"

      # 이번 빌드에 없고 7일 넘게 갱신되지 않은 파일만 지운다. 직전 빌드 파일은 배포 간격과 상관없이 남긴다.
      # 직전 배포가 7일보다 오래됐으면 그 시각을 기준으로 잡아, 직전 배포에 올라간 파일이 걸리지 않게 한다.
      - name: Remove stale files from S3
        run: |
          BUCKET="${S3_BUCKET%%/*}"
          PREFIX="${S3_BUCKET#*/}/"
          CUTOFF="$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%S)"
          if [ -n "$PREV_DEPLOY" ] && [[ "$PREV_DEPLOY" < "$CUTOFF" ]]; then CUTOFF="$PREV_DEPLOY"; fi
          aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "$PREFIX" --output json \
            | jq -r --arg cutoff "$CUTOFF" '.Contents[]? | select(.LastModified < $cutoff) | .Key' \
            | while read -r key; do
                [ -e "dist/${key#"$PREFIX"}" ] && continue
                aws s3 rm "s3://${BUCKET}/${key}"
              done

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"

      - name: Deployment Summary
        if: always()
        run: |
          {
            echo "### Frontend Deploy Summary :rocket:"
            echo ""
            echo "- **Branch:** ${{ github.ref_name }}"
            echo "- **Commit:** ${{ github.sha }}"
            echo "- **Status:** ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
