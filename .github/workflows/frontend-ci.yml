name: Frontend CI

on:
  # PR이 열릴 때, 업데이트될 때, 다시 열릴 때
  pull_request:
    branches: [dev, prod]
    paths:
      - "frontend/**"

  # 다른 워크플로우에서 호출할 수 있도록 설정
  workflow_call:
    outputs:
      # 빌드 결과를 다른 워크플로우에서 사용할 수 있도록 출력
      build-success:
        description: "Build completion status"
        value: ${{ jobs.ci.outputs.build-success }}

# 같은 PR에 새 커밋을 push하면 직전 실행을 취소한다.
# CD가 workflow_call로 부른 실행은 그룹이 호출자 이름으로 잡혀
# (frontend-deploy-dev와 다르다) 배포를 끊지 않는다 — backend-ci.yml 주석 참고.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # 출력 설정
    outputs:
      build-success: ${{ steps.build.outputs.success }}

    # frontend 폴더를 기본 작업 디렉토리로 설정
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        # prod 브랜치 빌드는 prod 백엔드 주소를 굽는다 (PR·dev는 API_URL).
        # npm run build(webpack.common.js)는 `.env.${mode}` = .env.production을 읽으므로
        # 파일명을 .env로 쓰면 API_URL이 번들에 들어가지 않는다(undefined로 구워짐).
        run: |
          echo "API_URL=${{ github.ref_name == 'prod' && secrets.API_URL_PROD || secrets.API_URL }}" >> .env.production
          echo "DSN_KEY=${{ secrets.DSN_KEY }}" >> .env.production
          echo "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}" >> .env.production
          echo "ENABLE_DEVTOOLS=${{ github.ref_name == 'prod' && 'false' || 'true' }}" >> .env.production

      - name: Run ESLint
        run: npm run lint
        continue-on-error: false

      - name: Run Tests
        run: npm run test:jest
        env:
          CI: true

      - name: Run Build
        id: build
        run: |
          npm run build
          # 라우트별 정적 HTML·sitemap 이 실제로 생성됐는지 확인한다 (#1710).
          # 빠지면 CloudFront 가 SPA fallback 으로 홈 HTML 을 주고 색인이 다시 홈으로 합쳐진다.
          grep -q 'canonical" href="https://www.zzol.site/games/card-game"' dist/games/card-game/index.html
          grep -q 'name="robots" content="noindex' dist/404/index.html
          test "$(grep -c '<loc>' dist/sitemap.xml)" -eq 11
          echo "success=true" >> $GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
