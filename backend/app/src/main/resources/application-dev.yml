spring:
  data:
    redis:
      host: ${REDIS_HOST}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true

web:
  cors:
    allowed-origins:
      - https://dev.zzol.site
      - https://dev.api.zzol.site   # 어드민 페이지(/admin/**)가 dev.api.zzol.site에서 서빙 — 어드민 호출 CORS 허용

room:
  qr:
    prefix: "https://dev.zzol.site/join/"

nickname-audit:
  # dev 는 flash-lite 를 쓴다. Gemini 요청 한도는 모델별로 세므로 prod 의 flash 와 쿼터가 갈린다.
  model: gemini-3.5-flash-lite

websocket:
  docs:
    server-url: "https://api.dev.zzol.site/ws"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

server:
  tomcat:
    remoteip:
      # Docker 기본 브릿지 네트워크 대역 (172.17.0.0/16 등) 포함
      internal-proxies: "127\\.0\\.0\\.1|10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2[0-9]|3[0-1])\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}"
