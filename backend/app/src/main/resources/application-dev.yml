spring:
  data:
    redis:
      host: ${REDIS_HOST}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true

web:
  cors:
    allowed-origins:
      - https://dev.zzol.site
      # 백오피스 SPA(admin-web). 별도 도메인이라 CORS 허용이 없으면 로그인부터 막힌다.
      # 예전 Thymeleaf 백오피스는 API와 같은 도메인에서 서빙돼 이 항목이 필요 없었다.
      - https://admin.dev.zzol.site

admin:
  auth:
    # refresh 와 logout 을 부를 수 있는 오리진(admin-web). CORS 허용 목록과 따로 둔다.
    web-origins:
      - https://admin.dev.zzol.site

room:
  qr:
    prefix: "https://dev.zzol.site/join/"

nickname-audit:
  cron: "0 */30 * * * *"  # prod 와 Gemini 하루 한도를 나눠 쓸 수 있다. 둘 다 5분이면 하루 576회차로 한도(약 500)를 넘는다.

websocket:
  docs:
    server-url: "https://api.dev.zzol.site/ws"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

server:
  tomcat:
    remoteip:
      # Docker 기본 브릿지 네트워크 대역 (172.17.0.0/16 등) 포함
      internal-proxies: "127\\.0\\.0\\.1|10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2[0-9]|3[0-1])\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}"
