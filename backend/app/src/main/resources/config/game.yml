# 미니게임 타이밍 및 스케줄러 설정 (card-game, block-stacking, ladder, racing-game, speed-touch, blind-timer, roulette)
game:
  scheduler:
    pool-size: 2   # 전 게임 공통 (GameTaskSchedulerFactory)

card-game:
  timing:
    first-loading: 4000ms
    loading: 3000ms
    prepare: 2000ms
    playing: 10250ms
    score-board: 1500ms
    early-finish-delay: 2000ms

block-stacking:
  timing:
    prepare: 3000ms
    playing: 20000ms
    all-failed-delay: 2000ms

ladder:
  timing:
    description: 4000ms
    prepare: 2000ms
    drawing: 8000ms
    drawing-grace-period: 300ms
    result: 5000ms

racing-game:
  timing:
    description: 4000ms
    prepare: 2000ms
    race-finished-delay: 2000ms
    move-interval: 100ms

speed-touch:
  timing:
    description: 4000ms
    prepare: 2000ms
    playing: 30000ms

blind-timer:
  timing:
    description: 4000ms
    prepare: 2000ms
    blind-delay: 3000ms
    timeout-buffer: 3000ms
    result-delay: 2000ms

nunchi:
  timing:
    description: 4000ms         # 시작 규칙 설명(다른 미니게임과 동일하게 READY 진입 전 짧게 대기)
    ready: 3000ms              # 곧 시작 카운트다운(playStartEpochMs까지 대기, 전원 동시 PLAYING 진입)
    number-window: 300ms        # 동시 판정 윈도우(ADR-0031 Q2 — 첫 press anchor + 300ms)
    collision-cooldown: 2000ms  # 충돌 후 재개 대기(결정 6)
    idle-timeout: 10000ms       # 무입력 자동 종료(결정 5 — 유효 입력마다 리셋, 쿨다운 중 일시정지)
    hard-cap: 30000ms           # 라운드 전체 강제 종료 안전망(결정 5)
    all-pressed-delay: 2000ms   # 전원 입력 조기 종료 시 마지막 입력을 잠깐 보여주고 DONE으로 전이(결정 5)

worm-game:
  timing:
    description: 4000ms
    prepare: 2000ms
    finish: 4000ms               # 종료 연출(줌아웃 + 순위 스태거) — 서버 주도
    snapshot-interval: 10000ms   # 주기 스냅샷은 정합 검증 보조. 재접속 복구는 구독 시점 유니캐스트가 맡는다
  # 틱 주기(20Hz)는 rules.tick-millis(기본 50)가 단일 출처다 — 점수(생존 ms)와 스케줄 주기가 같이 움직인다.
  # rules(물리·판정 16개 노브)는 WormGameRulesProperties의 @DefaultValue가 설계 문서 v0.3 값이다.
  # 튜닝할 때만 worm-game.rules.* 로 덮어쓴다.

roulette:
  default-adjustment-weight: 0.7
