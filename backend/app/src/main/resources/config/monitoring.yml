# Actuator 엔드포인트, OTLP/Tempo 트레이싱, 로깅 패턴, Slack 알림
management:
  endpoint:
    health:
      show-details: always
      group:
        liveness:
          include: "ping"
          show-details: always
        readiness:
          include: "db,redis,gracefulShutdown,redisStream"
          show-details: always
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus,tracing,circuitbreakers,retries"
  tracing:
    enabled: true
    sampling:
      probability: ${TRACE_SAMPLING_PROBABILITY}
  otlp:
    tracing:
      endpoint: ${TEMPO_URL}
    # 메트릭은 아래 prometheus scrape 로 걷는다. OTLP 메트릭 push 는 트레이싱용
    # spring-boot-starter-opentelemetry 가 micrometer-registry-otlp 를 딸려오면서 기본값 true 로
    # 켜진 것뿐이라, 아무도 설정하지 않은 URL(micrometer 기본값 localhost:4318/v1/metrics)로 매 step
    # 푸시하다 실패한다. 위 tracing 과는 별개 오토컨피그(OtlpMetricsExportAutoConfiguration)라 영향 없다
    metrics:
      export:
        enabled: false
  metrics:
    enable:
      tomcat: true
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: info
    io.opentelemetry.exporter.logging.LoggingSpanExporter: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"

slack:
  webhook-url: ${SLACK_WEBHOOK_URL:}
  connect-timeout: 3s
  read-timeout: 5s
