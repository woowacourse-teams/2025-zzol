# Redis, Redis Stream 스레드풀/스트림 키 설정, Redisson 클라이언트
spring:
  data:
    redis:
      port: 6379
      ssl:
        enabled: false
      host: localhost
      lettuce:
        shutdown-timeout: 300ms

redis:
  stream:
    # 공통 기본 설정 (각 스트림에서 오버라이드 가능)
    common-settings:
      max-length: 100
      batch-size: 10
      poll-timeout: 2s
      # 기동 시 구독(폴링 태스크) 시작 대기 한도 — 초과 시 기동 실패 (ADR-0022)
      subscription-start-timeout: 5s
    # 공유 스레드풀
    thread-pools:
      concurrent:
        core-size: 8
        max-size: 16
        queue-capacity: 1024
    # 스트림 설정 (key가 식별자)
    keys:
      "[room]":
        thread-pool-name: concurrent
      "[room:join]":
        thread-pool:
          core-size: 1
          max-size: 1
          queue-capacity: 1024
      "[cardgame:select]":
        thread-pool:
          core-size: 1
          max-size: 1
          queue-capacity: 1024
      "[minigame]":
        thread-pool-name: concurrent
      "[racinggame]":
        thread-pool-name: concurrent
      # 지렁이 게임 조향 — 방당 9인×10Hz=90msg/s. 버퍼 초 = max-length / (90 × 동시 방 수):
      # 3000이면 10방 동시에도 ≈3.3초. 조향은 마지막 값만 유효라 그 이상 밀린 메시지는 버려도 되고,
      # 그때 병목은 버퍼가 아니라 스트림당 단일 폴링 태스크의 처리량이다(#1681).
      "[wormgame]":
        thread-pool-name: concurrent
        max-length: 3000
      "[speedtouch]":
        thread-pool-name: concurrent
      "[blindtimer]":
        thread-pool-name: concurrent
      "[blockstacking]":
        thread-pool-name: concurrent
      "[laddergame]":
        thread-pool-name: concurrent
      # 눈치게임 입력은 순서 보존이 핵심(ADR-0031 N1)이라 전용 단일스레드 풀로 직렬 처리한다
      # ([cardgame:select] 선례). 도착 순서가 곧 컨슈머 처리 순서가 되도록 core=max=1.
      "[nunchi]":
        thread-pool:
          core-size: 1
          max-size: 1
          queue-capacity: 1024
      # 시즌 정산 작업 큐 — 브로드캐스트가 아니라 컨슈머 그룹의 단일 처리 경로로 소비한다(#1610).
      # 전달 보장은 at-least-once이고 중복 반영은 정산 원장의 멱등 처리가 막는다.
      # listener-enabled: false로 브로드캐스트 리스너를 만들지 않고, 발행 경로(StreamPublisher)만 연다.
      # max-length가 짧으면 소비가 밀릴 때 미처리 메시지가 트리밍되어 PEL 회수(XCLAIM)가 빈 껍데기가
      # 되므로, 처리 보장이 목적인 이 스트림은 브로드캐스트 스트림(100)과 달리 길게 잡는다.
      "[settlement:result]":
        listener-enabled: false
        max-length: 10000

redisson:
  enabled: true
  timeout: 1000
  connect-timeout: 3000
  retry-attempts: 1
  retry-interval: 500
