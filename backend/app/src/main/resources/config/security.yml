# Spring Security OAuth2 (Google/Kakao/Naver), IP 차단 정책, 관리자 계정, 사용자 JWT/OAuth
spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile,email
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            scope: profile_nickname,account_email
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: name,email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

security:
  ip-block:
    not-found-threshold: 5
    not-found-window: 1h
    block-ttl: 24h
    exempt-paths:
      - /admin
      - /reports
      - /css
      - /favicon.ico

admin:
  auth:
    # 부트스트랩 허용목록. UI로 지울 수 없는 break-glass 경로다.
    # 쉼표로 구분한다. 예: ADMIN_EMAILS=mj04300017@gmail.com,other@example.com
    emails: ${ADMIN_EMAILS:}
    # 백오피스 전용 구글 OAuth 웹 클라이언트 ID. 서비스 로그인용과 분리해서 발급한다.
    google-client-id: ${ADMIN_GOOGLE_CLIENT_ID:}
    # 미설정 시 사용자 JWT secret으로 폴백한다. 배포를 깨지 않으면서 분리 여지를 남긴다.
    # 같은 키를 쓰더라도 type=ADMIN 클레임 검증이 있어 사용자 토큰은 관리자로 통과하지 못한다.
    #
    # 환경변수(${JWT_SECRET})가 아니라 이미 해석된 프로퍼티(user.jwt.secret)를 가리킨다.
    # local 프로필은 그 값을 환경변수 없이 yml 에 직접 넣어 두는데, 환경변수를 참조하면
    # 거기서 플레이스홀더가 풀리지 않아 앱이 기동조차 못 한다.
    jwt-secret: ${ADMIN_JWT_SECRET:${user.jwt.secret}}
    token-validity-seconds: 3600   # 1시간. 리프레시 토큰 없음, 만료되면 재로그인

user:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-seconds: 1800       # 30분
    refresh-token-expiration-seconds: 1209600   # 14일
  oauth:
    frontend-redirect-uri: ${OAUTH_FRONTEND_REDIRECT_URI}
  email-crypto:
    encryption-key: ${USER_EMAIL_ENCRYPTION_KEY}
    hmac-key: ${USER_EMAIL_HMAC_KEY}
