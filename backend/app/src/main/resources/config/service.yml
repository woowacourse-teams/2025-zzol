# 서비스 도메인 설정 (user, room, player, friend, outbox, report, nickname-audit, profanity)
user:
  code:
    max-retry: 100

room:
  removalDelay: 1h
  finishedRemovalDelay: 30s   # 룰렛까지 끝난 방을 정리하기까지의 지연
  qr:
    width: 150
    height: 150
    presignedUrl:
      expirationHours: 1
    storage-key-prefix: qr-code
  event:
    timeout: 5s

player:
  removalDelay: 15s

friend:
  presence:
    grace-period-seconds: 10

outbox:
  relay:
    delay: 500  # ms, 로컬에서는 application-local.yml로 오버라이드

report:
  rate-limit:
    rate: 5
    rate-interval: 1h
    ttl: 1h

nickname-audit:
  gemini-api-key: ${GEMINI_API_KEY}   # local/test 프로파일에서는 NoOpNicknameAuditor가 대신 동작
  model: gemini-3.5-flash-lite
  flagged-threshold: 0.85
  batch-size: 100                      # API 호출 1회당 처리량. 레이트리미터가 13초에 1회를 허용해 분당 약 460건이다.
  feedback-injection-threshold: 20
  min-term-length: 2                   # 자동 차단할 비속어 조각의 정규화 후 최소 길이 (짧을수록 Trie 부분일치 과차단 위험 ↑)
  max-run-duration: 10m                # 한 회차가 실행기 스레드를 붙잡아도 되는 상한. 넘으면 남은 적체는 다음 회차로.
  max-attempts: 3                      # 한 행이 검열 호출 실패를 견디는 횟수. 닿으면 DEAD_LETTER가 되어 스캔에서 빠진다.
  request-timeout: 120s                # Gemini HTTP 타임아웃. 없으면 응답 없는 호출이 스케줄러 스레드를 무기한 점유한다.
                                       # batch-size 를 올리면 응답 생성 시간도 늘어나므로 함께 올린다.
  daily-call-limit: 400                # 하루(태평양 시간 자정 기준) Gemini 요청 수 상한. 닿으면 남은 행은 UNAUDITED로 다음 날을 기다린다.
                                       # 5분 주기의 최악은 회차마다 미검열이 있는 288회다. 무료 한도 500 RPD 는 포럼·AI Studio
                                       # 보고에서 온 값이라, 프로젝트의 AI Studio 한도 화면에서 확인한 값보다 작게 둔다(#1907).
  cron: "0 */5 * * * *"                # 검열 회차 주기. 미검열 닉네임이 없는 회차는 Gemini를 부르지 않는다.
  seed:
    count: 0                           # local 에서 넣을 측정용 미검열 닉네임 수. 0 이면 안 넣는다.
  stub:                                # local/test 프로파일의 NoOpNicknameAuditor 동작. 아래 기본값이면 지연 0에 전부 CLEAN.
    latency: 0s                        # 호출 하나가 흉내 낼 지연. 0으로 두면 LLM이 무한히 빠를 때의 처리량을 잰다.
    flagged-ratio: 0                   # FLAGGED로 판정할 비율(0~1). 올리면 자동 차단·사전 INSERT·트라이 재빌드까지 실제로 탄다.
                                       # 해상도는 0.01이다. 그보다 작은 값은 0으로 반올림돼 아무것도 안 걸린다.

profanity:
  trie:
    rebuild:
      min-interval: 5s                 # 재빌드 최소 간격(#1759). 근거는 ProfanityTrieRebuildProperties 참고.
