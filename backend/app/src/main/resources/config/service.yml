# 서비스 도메인 설정 (user, room, player, friend, outbox, report, nickname-audit)
user:
  code:
    max-retry: 100

room:
  removalDelay: 1h
  finishedRemovalDelay: 30s   # 룰렛까지 끝난 방을 정리하기까지의 지연
  qr:
    width: 150
    height: 150
    presignedUrl:
      expirationHours: 1
    storage-key-prefix: qr-code
  event:
    timeout: 5s

player:
  removalDelay: 15s

friend:
  presence:
    grace-period-seconds: 10

outbox:
  relay:
    delay: 500  # ms, 로컬에서는 application-local.yml로 오버라이드

report:
  rate-limit:
    rate: 5
    rate-interval: 1h
    ttl: 1h

nickname-audit:
  gemini-api-key: ${GEMINI_API_KEY}   # local/test 프로파일에서는 NoOpNicknameAuditor가 대신 동작
  model: gemini-3.5-flash
  flagged-threshold: 0.85
  batch-size: 100                      # API 호출 1회당 처리량 (RPM 5 기준 100개씩 5회 = 500개/min)
  feedback-injection-threshold: 20
  min-term-length: 2                   # 자동 차단할 비속어 조각의 정규화 후 최소 길이 (짧을수록 Trie 부분일치 과차단 위험 ↑)
  max-run-duration: 10m                # 한 회차가 실행기 스레드를 붙잡아도 되는 상한. 넘으면 남은 적체는 다음 회차로.
  max-attempts: 3                      # 한 행이 검열 호출 실패를 견디는 횟수. 닿으면 DEAD_LETTER가 되어 스캔에서 빠진다.
  request-timeout: 120s                # Gemini HTTP 타임아웃. 없으면 응답 없는 호출이 스케줄러 스레드를 무기한 점유한다.
                                       # batch-size 를 올리면 응답 생성 시간도 늘어나므로 함께 올린다.
