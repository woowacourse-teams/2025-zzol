# Prometheus 알림 룰 — 애플리케이션 증상 기반 (ADR-0026 Phase A)
#
# "두 엔진 어디에도 없던 신규 인시던트 룰" 본체. 앱 코드 변경 없이 기존 메트릭만으로
# 증상을 잡는다(ADR-0026 §5). 라벨 기반 정밀화(PrivateIpBanned 등)는 후속 PR.
#
# 사용 메트릭 (ADR-0026 컨텍스트에서 수집 확인됨):
#   http_server_requests_seconds_count  라벨: uri, status, method, job
#   ip_block_new_total                  신규 BAN 카운터
#   ip_block_request_blocked_total      차단된 요청 카운터
#   login_start_total / login_success_total  라벨: provider, job — LoginMetricService(앱 코드) 신설
#     (예외: LoginSuccessDroppedToZero는 기존 메트릭으로 잡히지 않아 전용 카운터를 도입했다)
#
# ⚠️ 임계값은 전부 베이스라인 미측정 상태의 보수적 추정치다(ADR-0026 트레이드오프).
#    배포 전 Prometheus API로 정상 범위를 재고, 초기엔 오탐을 줄이는 방향(높게)으로 둔다.
groups:
  - name: app-symptoms
    rules:
      # HTTP 5xx 비율 급증 — 서버 측 광범위 실패.
      # 비율(=5xx/전체)로 보아 트래픽 규모와 무관하게 동작하게 한다.
      # 분모가 0이면(요청 없음) 식 자체가 결과를 내지 않아 발화하지 않는다(정상).
      - alert: Http5xxRatioHigh
        expr: |
          sum by (job) (rate(http_server_requests_seconds_count{status=~"5..",job=~"dev-app|prod-app"}[5m]))
          /
          sum by (job) (rate(http_server_requests_seconds_count{job=~"dev-app|prod-app"}[5m]))
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "HTTP 5xx 비율 5% 초과 ({{ $labels.job }})"
          description: "최근 5분 5xx 비율이 {{ $value | humanizePercentage }}. 서버 측 광범위 실패 가능성."

      # 대량 IP 차단 급증 — 이미 차단된 IP의 요청이 거절되는 비율(ADR-0026 §5).
      # prod로 한정하고 job 라벨을 보존한다(#1592). 이전에는 job 필터 없는 sum()이라
      # dev·prod를 합산했고, dev가 스캐너 스윕을 받는 동안 그 수치가 전체 합계가 되어
      # prod 무이상 상태에서 CRITICAL 13건이 오발화했다. 또한 sum()이 라벨을 제거해
      # Alertmanager 라우팅과 zzol-bot의 환경 식별이 불가능했다(ADR-0032).
      # 임계 2 req/s — prod 관측 최대 0.528 req/s 대비 약 4배 여유(2026-07 실측).
      # ⚠️ 30일 베이스라인 확보 후 재조정 필요.
      # description에 원인 가설을 적지 않는다 — 웹훅 payload로 zzol-bot 프롬프트에
      # 들어가 LLM이 그 가설을 결론으로 되돌려준다(#1592).
      - alert: MassIpBlockingSpike
        expr: sum by (job) (rate(ip_block_request_blocked_total{job="prod-app"}[5m])) > 2
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "IP 차단 요청 급증 ({{ $labels.job }})"
          description: "차단 요청이 {{ $value | printf \"%.2f\" }} req/s. 베이스라인(약 0.5 req/s) 대비 급증. 차단된 IP와 요청 경로를 확인."

      # 신규 BAN 급증 — 위 증상의 선행 신호(차단 요청보다 BAN 등록이 먼저 튄다).
      # MassIpBlockingSpike와 동일하게 prod 한정 + job 라벨 보존(#1592).
      # 임계 0.5/s — prod 관측 최대 0.055/s 대비 약 9배 여유(2026-07 실측).
      # ⚠️ 30일 베이스라인 확보 후 재조정 필요.
      - alert: IpBanRateSpike
        expr: sum by (job) (rate(ip_block_new_total{job="prod-app"}[5m])) > 0.5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "신규 IP BAN 급증 ({{ $labels.job }})"
          description: "신규 BAN이 {{ $value | printf \"%.2f\" }} /s. 차단된 IP 대역과 접근 경로를 확인."

      # WebSocket 핸드셰이크 실패 — /ws 엔드포인트의 HTTP 에러 응답 급증.
      # 기존 Grafana 룰(websocket_connections_failed_total, STOMP 연결 단계)과 중복을 피하려
      # 의도적으로 HTTP 핸드셰이크 계층(http_server_requests)에서 본다(ADR-0026 §5).
      # ⚠️ uri 라벨 값(/ws/info, /ws/** 등 SockJS 매핑 패턴)은 서버에서 실측 확인 필요.
      #    실제 라벨이 다르면 이 룰은 조용히 발화하지 않으므로 배포 시 1순위로 검증한다.
      - alert: WsHandshakeFailure
        expr: |
          sum (rate(http_server_requests_seconds_count{uri=~"/ws.*",status=~"4..|5..",job=~"dev-app|prod-app"}[5m]))
          > 1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "WebSocket 핸드셰이크 실패 급증 (/ws*)"
          description: "/ws* 4xx/5xx 응답이 {{ $value | printf \"%.2f\" }} /s. nginx Upgrade/Connection 헤더 소실 또는 인증 실패 가능성."

      # OAuth 로그인 성공 소멸 — 시도는 계속되는데 성공이 없다.
      # redirect_uri 불일치(카카오 KOE006 등)는 5xx 없이 사용자가 provider 페이지에서
      # 튕겨 돌아오지 않아 에러율로는 안 잡힌다. 시작(login_start)은 늘고 성공(login_success)이
      # 사라지는 것으로만 드러나므로 그 비교로 발화한다. (메트릭: LoginMetricService, 이 PR에서 신설)
      # unless 사용: 성공 rate가 0이거나 시리즈가 아예 없을 때(배포 직후 한 번도 성공 못 한
      #   경우 포함) 모두 발화한다. == 0 만으로는 "시리즈 부재"를 놓친다.
      # provider 라벨이 동시에 여럿 뜨면 인프라(baseUrl/프록시), 하나만 뜨면 그 provider 콘솔/시크릿.
      - alert: LoginSuccessDroppedToZero
        # provider 매처는 방어적 이중 안전망 — 앱(LoginStartMetricFilter)이 이미 지원 provider만
        # 집계하지만, 혹시 모를 유입으로 알림이 오발화하지 않도록 여기서도 화이트리스트로 좁힌다.
        expr: |
          sum by (job, provider) (rate(login_start_total{job=~"dev-app|prod-app",provider=~"google|kakao|naver"}[5m])) > 0
          unless
          sum by (job, provider) (rate(login_success_total{job=~"dev-app|prod-app",provider=~"google|kakao|naver"}[5m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.provider }} 로그인 성공 0 ({{ $labels.job }}) — 시도는 계속됨"
          description: "최근 로그인 시도는 있으나 성공이 없다. redirect_uri(스킴/호스트)·provider 콘솔 등록·시크릿을 점검. 여러 provider 동시 발생 시 프록시/baseUrl 의심."
