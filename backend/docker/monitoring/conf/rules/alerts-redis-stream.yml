# Prometheus 알림 룰 — Redis Stream 메시지 파이프라인 (ADR-0026 Phase A)
#
# 메시지 처리 흐름(Handler → Stream 발행 → Consumer → App Service → Notifier)의
# 지연·적체를 본다. 이 경로가 막히면 게임 액션이 클라이언트에 늦게/안 전달된다.
#
# 사용 메트릭 (ADR-0026 컨텍스트에서 수집 확인됨):
#   redis_stream_e2e_latency_seconds_bucket   발행~소비 지연 히스토그램 → 분위수 계산 가능
#   redis_stream_group_lag                    정산 그룹에 아직 전달되지 않은 메시지 수 (XINFO GROUPS)
#   redis_stream_group_pending                정산 그룹이 전달받고 ACK하지 않은 메시지 수 (XINFO GROUPS)
#
# redis_stream_length(XLEN)와 redis_stream_threadpool_*은 적체 판정에 쓰지 않는다. 사유는 아래
# "브로드캐스트 스트림의 적체를 무엇으로 재는가" 주석에 적었다(#1744).
#
# ⚠️ 임계값은 베이스라인 미측정 추정치. 배포 전 정상 분위수/적체 수를 재고 조정한다.
groups:
  - name: redis-stream
    rules:
      # E2E 처리 지연 p95 — 발행부터 처리 완료까지.
      # 버킷이 있으므로 histogram_quantile로 분위수를 직접 계산한다(ADR-0026 line 22).
      # prod로 한정하고 job 라벨을 보존한다(#1596) — 이전에는 sum by (le)가 dev·prod 히스토그램을
      # 합쳐, 07/17 21:05 알림은 dev 2.201s에서 나왔고 prod는 표본조차 없었다.
      # 임계 0.5s 유지 — prod 관측 최대 p95가 65ms라 여유가 충분하다(2026-07 실측).
      - alert: RedisStreamE2eLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, job) (rate(redis_stream_e2e_latency_seconds_bucket{job="prod-app"}[5m]))
          ) > 0.5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Redis Stream E2E 지연 p95 > 500ms ({{ $labels.job }})"
          description: "스트림 처리 p95 지연이 {{ $value | printf \"%.3f\" }}s. 컨슈머 처리 적체 또는 다운스트림(App Service) 지연 가능성."

      # 브로드캐스트 스트림의 적체를 무엇으로 재는가 — 위 E2E 지연 룰이 본다.
      # XLEN 기반 RedisStreamBacklogHigh는 제거했다(#1744). XLEN은 적체가 아니라 스트림에 남은
      # 전체 엔트리 수다. 엔트리를 줄이는 장치는 StreamPublisher의 MAXLEN 트리밍뿐이고 TTL도 삭제도
      # 없어서, 발행량이 상한에 닿는 순간 XLEN은 그 상한에 붙어 머문다. wormgame은 상한이 3000이라
      # 임계 1000을 상시 넘겨 prod에서 계속 발화했다. 상한이 곧 관측 최댓값이므로 임계를 어디에 두든
      # 상시 발화 아니면 영원한 침묵이고, 어느 쪽도 컨슈머가 밀렸는지는 알려주지 않는다.
      # 스레드풀 큐 깊이(redis_stream_threadpool_queue_size)도 대안이 아니다. 큐에 들어가는 건
      # 스트림당 폴링 태스크 하나뿐이고 메시지 처리는 그 태스크 안에서 인라인으로 돈다(ADR-0022).
      # 정상 상태에서 항상 0이고, 0이 아니면 구독이 시작조차 못 한 기동 실패다.
      # 컨슈머가 발행을 못 따라가면 발행~소비 시간차가 벌어지므로 E2E 지연이 그 신호를 그대로 받는다.

      # 정산 컨슈머 그룹 적체 — 컨슈머 그룹을 쓰는 유일한 스트림이라 진짜 미처리 수를 읽을 수 있다(#1610).
      # 브로드캐스트 리스너가 없어(listener-enabled: false) E2E 지연 룰의 관측 대상이 아니므로 따로 본다.
      # lag은 그룹에 아직 전달되지 않은 수라 컨슈머가 XREADGROUP을 못 돌리는 상황을 잡고, pending은
      # 전달받고 ACK하지 않은 수라 같은 메시지 처리에 반복 실패하는 상황을 잡는다. 두 지표는 NaN이
      # 되는 조건이 서로 달라(lag은 Redis가 산정 불가하면 null) 더하지 않고 룰을 나눈다.
      # blue/green 두 인스턴스가 같은 그룹 상태를 보고하므로 max()로 중복을 없애고, stream·group
      # 라벨은 남겨 알림만 보고도 원인 스트림을 알 수 있게 한다(#1596·#1744).
      # ⚠️ 임계 10은 베이스라인 미측정 추정치. 정산은 미니게임 종료 1건당 1메시지라 평시 lag·pending은
      # 곧 0으로 돌아가고, 처리에 실패하는 메시지도 5회 재전달 뒤 DLQ로 빠진다(ADR-0035). 10건이
      # 10분간 유지되면 컨슈머도 PEL 스위퍼도 비우지 못하는 상태다. 상한 10000에 닿아 미처리분이
      # 트리밍되기(=PEL 회수가 빈 껍데기가 되기) 한참 전에 알린다.
      - alert: SettlementStreamGroupLagHigh
        expr: max by (job, stream, group) (redis_stream_group_lag{job="prod-app"}) > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "정산 스트림 미전달 적체 (lag > 10, {{ $labels.stream }})"
          description: "{{ $labels.group }} 그룹에 전달되지 않은 메시지가 {{ $value }}건. 컨슈머가 스트림을 읽지 못하고 있습니다."

      - alert: SettlementStreamGroupPendingHigh
        expr: max by (job, stream, group) (redis_stream_group_pending{job="prod-app"}) > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "정산 스트림 미ACK 적체 (pending > 10, {{ $labels.stream }})"
          description: "{{ $labels.group }} 그룹이 전달받고 ACK하지 않은 메시지가 {{ $value }}건. 정산 처리가 반복 실패하거나 컨슈머가 죽었을 수 있습니다."

      # Outbox DEAD_LETTER 적체 — 재시도 초과로 죽은 이벤트가 쌓이면 메시지 유실.
      # 과거 zzol-bot 자체 폴링(DB count ≥ 10)을 Prometheus로 이관(ADR-0032). "적체 깊이" 신호라
      # 로그 율 기반 룰(Loki ERROR 카운트)로는 못 잡는 느린 누적을 잡는다.
      # blue/green 두 인스턴스가 같은 DB를 보므로 값이 동일 → max()로 중복 제거.
      # 다만 dev·prod는 DB가 다르므로 job으로 한정하지 않으면 두 환경까지 뭉갠다(#1596).
      # ⚠️ 임계 10은 옛 self-poll 임계 보존(추정치). 배포 후 정상 범위로 보정.
      - alert: OutboxDeadLetterHigh
        expr: max by (job) (outbox_dead_letter_count{job="prod-app"}) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Outbox DEAD_LETTER 적체 (> 10, {{ $labels.job }})"
          description: "재시도 초과로 DEAD_LETTER 전환된 outbox 이벤트가 {{ $value }}건. 다운스트림 발행 경로 점검 필요."
