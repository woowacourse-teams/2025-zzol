# ============================================
# Prod Application 공통 설정 (Blue/Green 공유)
# ============================================
x-prod-app: &prod-app
  restart: unless-stopped
  environment:
    - JAVA_OPTS=${JAVA_OPTS:--Xms4200m -Xmx4200m}
    - SPRING_PROFILES_ACTIVE=prod
    - MYSQL_URL=jdbc:mysql://prod-mysql:3306/coffee_shout?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    - MYSQL_USERNAME=root
    - MYSQL_PASSWORD=${DB_PASSWORD}
    - REDIS_HOST=prod-redis
    - REDIS_PORT=6379
    - ORACLE_REGION=${ORACLE_REGION:-ap-chuncheon-1}
    - ORACLE_NAMESPACE=${ORACLE_NAMESPACE}
    - ORACLE_BUCKET=${ORACLE_BUCKET}
    - TEMPO_URL=${TEMPO_URL:-http://tempo:4318/v1/traces}
    - TRACE_SAMPLING_PROBABILITY=${TRACE_SAMPLING_PROBABILITY:-0.1}
    - STDICT_API_KEY=${STDICT_API_KEY}
    - ADMIN_EMAILS=${ADMIN_EMAILS}
    - ADMIN_GOOGLE_CLIENT_ID=${ADMIN_GOOGLE_CLIENT_ID}
    - GEMINI_API_KEY=${GEMINI_API_KEY}
    - GEMINI_ZZOL_BOT_API_KEY=${GEMINI_ZZOL_BOT_API_KEY}
    - LOKI_URL=http://loki:3100
    - ZZOL_BOT_TEMPO_URL=http://tempo:3200
    - PROMETHEUS_URL=http://prometheus:9090
    - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
    - ZZOL_BOT_SLACK_WEBHOOK_URL=${ZZOL_BOT_SLACK_WEBHOOK_URL}
    - ZZOL_BOT_ALERT_WEBHOOK_TOKEN=${ZZOL_BOT_ALERT_WEBHOOK_TOKEN}
    # 섀도우 분석 스위치. 켜면 prod-llama를 같은 알림으로 나란히 부른다. 운영 판정은 안 바뀐다.
    # 주소는 컨테이너 이름으로 고정한다. 앱 기본값 127.0.0.1은 컨테이너 안에서 자기 자신이라 못 쓴다
    - ZZOL_BOT_MONITOR_SHADOW_ENABLED=${ZZOL_BOT_MONITOR_SHADOW_ENABLED:-false}
    - ZZOL_BOT_SHADOW_BASE_URL=http://prod-llama:8080
    - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
    - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
    - NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
    - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
    - JWT_SECRET=${JWT_SECRET}
    - OAUTH_FRONTEND_REDIRECT_URI=${OAUTH_FRONTEND_REDIRECT_URI}
    - ROOM_SESSION_TOKEN_SECRET=${ROOM_SESSION_TOKEN_SECRET}
    - USER_EMAIL_ENCRYPTION_KEY=${USER_EMAIL_ENCRYPTION_KEY}
    - USER_EMAIL_HMAC_KEY=${USER_EMAIL_HMAC_KEY}
    - TZ=Asia/Seoul
  volumes:
    - prod-app-logs:/app/logs
  networks:
    - zzol-network
    - prod-network
    - monitoring-network
  depends_on:
    prod-mysql:
      condition: service_healthy
    prod-redis:
      condition: service_started
  healthcheck:
    test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/actuator/health/readiness"]
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 120s
  # 자원 제한 (Prod 환경: 총 2.0~2.5 vCPU, 12GB - 최우선 할당)
  # Docker 메모리 제한: 6GB
  # JVM 힙 설정: -Xms4200m -Xmx4200m (약 4.2GB, 70% 할당)
  # 메타스페이스: -XX:MaxMetaspaceSize=256m
  # 비힙 오버헤드: 약 1.8GB (메타스페이스 256MB + 스레드 스택 + 네트워크 버퍼 등)
  deploy:
    resources:
      limits:
        cpus: '1.5'        # 최대 1.5 vCPU
        memory: 6G         # 최대 6GB
      reservations:
        cpus: '1.0'        # 최소 1.0 vCPU 보장
        memory: 4G         # 최소 4GB 보장

services:
  # ============================================
  # Prod Application (Spring Boot) - Blue/Green
  # ============================================
  prod-app-blue:
    <<: *prod-app
    image: ${REGISTRY}/zzol-backend:${BLUE_IMAGE_TAG:-placeholder}
    container_name: prod-app-blue

  prod-app-green:
    <<: *prod-app
    image: ${REGISTRY}/zzol-backend:${GREEN_IMAGE_TAG:-placeholder}
    container_name: prod-app-green

  # ============================================
  # Prod MySQL Database
  # ============================================
  prod-mysql:
    image: mysql:8.0
    container_name: prod-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: coffee_shout
      TZ: Asia/Seoul
    volumes:
      - prod-mysql-data:/var/lib/mysql
      - prod-mysql-conf:/etc/mysql/conf.d
      - prod-mysql-logs:/var/log/mysql
      - prod-mysql-backup:/backup
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=200
      --innodb_buffer_pool_size=512M
      --slow_query_log=1
      --slow_query_log_file=/var/log/mysql/slow.log
      --long_query_time=2
    networks:
      - prod-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    # 자원 제한 (Prod MySQL)
    deploy:
      resources:
        limits:
          cpus: '0.7'        # 최대 0.7 vCPU
          memory: 4G         # 최대 4GB (InnoDB buffer pool + 여유분)
        reservations:
          cpus: '0.4'        # 최소 0.4 vCPU
          memory: 2G         # 최소 2GB

  # ============================================
  # Prod Redis (Valkey)
  # ============================================
  prod-redis:
    image: valkey/valkey:8.1.4-alpine
    container_name: prod-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
    volumes:
      - prod-redis-data:/data
    command: >
      valkey-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 1536mb
      --maxmemory-policy allkeys-lru
    networks:
      - prod-network
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    # 자원 제한 (Prod Redis)
    deploy:
      resources:
        limits:
          cpus: '0.3'        # 최대 0.3 vCPU
          memory: 2G         # 최대 2GB (캐시 확장 가능)
        reservations:
          cpus: '0.2'        # 최소 0.2 vCPU
          memory: 1G         # 최소 1GB

  # ============================================
  # Prod MySQL Exporter (for Prometheus)
  # ============================================
  prod-mysql-exporter:
    image: prom/mysqld-exporter
    container_name: prod-mysql-exporter
    restart: unless-stopped
    environment:
      - DB_PASSWORD=${DB_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "[client]
        user=root
        password=$${DB_PASSWORD}
        host=prod-mysql
        port=3306" > /tmp/.my.cnf
        exec /bin/mysqld_exporter --config.my-cnf=/tmp/.my.cnf
    networks:
      - prod-network
      - zzol-network
    depends_on:
      prod-mysql:
        condition: service_healthy
    # 자원 제한 (MySQL Exporter)
    deploy:
      resources:
        limits:
          cpus: '0.1'        # 최대 0.1 vCPU
          memory: 128M       # 최대 128MB
        reservations:
          cpus: '0.05'       # 최소 0.05 vCPU
          memory: 64M        # 최소 64MB

  # ============================================
  # Prod Redis Exporter (for Prometheus)
  # ============================================
  prod-redis-exporter:
    image: oliver006/redis_exporter
    container_name: prod-redis-exporter
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://prod-redis:6379
    networks:
      - prod-network
      - zzol-network
    depends_on:
      prod-redis:
        condition: service_healthy
    # 자원 제한 (Redis Exporter)
    deploy:
      resources:
        limits:
          cpus: '0.1'        # 최대 0.1 vCPU
          memory: 128M       # 최대 128MB
        reservations:
          cpus: '0.05'       # 최소 0.05 vCPU
          memory: 64M        # 최소 64MB

  # ============================================
  # Prod Alloy - Log Shipper (Promtail 후속, OTel Collector 기반)
  # ============================================
  prod-alloy:
    image: grafana/alloy:v1.16.3
    container_name: prod-alloy
    restart: unless-stopped
    volumes:
      - prod-app-logs:/app/logs:ro
      - ./conf/config.alloy:/etc/alloy/config.alloy:ro
      - /etc/localtime:/etc/localtime:ro
      - prod-alloy-data:/var/lib/alloy/data   # positions·WAL 영속화 (재생성 시 중복 적재 방지)
    # 기본 CMD(run /etc/alloy/config.alloy --storage.path=...)를 덮어쓰므로
    # --storage.path(WAL/state)를 반드시 유지한다. listen-addr은 네트워크 내
    # /-/ready·메트릭 노출을 위해 0.0.0.0:12345로 연다(기본은 loopback).
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    networks:
      - prod-network
      - zzol-network
    environment:
      - TZ=Asia/Seoul
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M

  # ============================================
  # Prod 자체 호스팅 LLM (zzol-bot 섀도우 분석 전용)
  # ============================================
  # 알림 분석에서 Gemini와 나란히 돌려 결과만 기록한다. 운영 판정과 Slack 게시는 Gemini 것이다.
  #
  # 실제 알림이 prod 에만 오기 때문에 여기에 둔다. Alertmanager 의 zzolbot-enrich 수신기가
  # nginx:8889 로 보내고 그 리스너는 prod 활성 색만 바라본다(dev 8890 은 수동 테스트 전용).
  #
  # 모델 파일은 레포에 없다. 호스트에 1회 배치한다(alloy bootstrap 과 같은 방식).
  # 없으면 deploy-infrastructure.sh 가 이 서비스만 건너뛴다.
  prod-llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: prod-llama
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
    volumes:
      - ${LLAMA_MODEL_DIR:-/home/ubuntu}:/models:ro
    # -t 2 는 아래 cpus 제한과 짝이다. 빼면 llama.cpp가 호스트 코어 수를 보고 스레드를 4개
    # 잡는데, 쿼터는 2코어라 생성 단계에서 스레드끼리 다퉈 20% 느려진다
    # (2026-09-20 실측: 스레드 2개 95.7초, 4개 119.0초. 프롬프트 2,574토큰 기준)
    command: >
      -m /models/${LLAMA_MODEL_FILE:-sft-v6-s1-q8_0.gguf}
      --host 0.0.0.0
      --port 8080
      --jinja
      -c 8192
      --no-warmup
      -t 2
    networks:
      - prod-network
    # 자원 제한 (Prod llama.cpp)
    # 호스트는 4코어고 dev 와 나눠 쓴다. 2코어로 묶어 절반을 남긴다.
    # 상시 점유가 아니다. 알림 한 건에 최장 96초고 일일 LLM 예산이 10건이다.
    cpu_shares: 512          # 경합하면 다른 컨테이너에 양보한다
    deploy:
      resources:
        limits:
          cpus: '2'          # 최대 2 vCPU
          memory: 3G         # 최대 3GB (실사용 1.9GB)
        reservations:
          cpus: '0.1'        # 유휴 시 0%라 최소만 잡는다
          memory: 512M

# ============================================
# Networks
# ============================================
networks:
  prod-network:
    driver: bridge
    name: prod-network
  zzol-network:
    external: true
  monitoring-network:
    external: true

# ============================================
# Volumes
# ============================================
volumes:
  prod-app-logs:
    driver: local
  prod-alloy-data:
    driver: local
  prod-mysql-data:
    driver: local
  prod-mysql-conf:
    driver: local
  prod-mysql-logs:
    driver: local
  prod-mysql-backup:
    driver: local
  prod-redis-data:
    driver: local
